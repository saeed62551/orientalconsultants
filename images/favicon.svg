<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92" width="100%" height="100%" fill="none">
  <defs>
    <filter id="favDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#071630" flood-opacity="0.4"/>
    </filter>
    <filter id="favCBevelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#021f4a" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="favBlueDisc" cx="38%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#034b9e"/>
      <stop offset="100%" stop-color="#022557"/>
    </radialGradient>
    <linearGradient id="favBlueRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#033878"/>
      <stop offset="100%" stop-color="#011938"/>
    </linearGradient>
    <linearGradient id="favChromeFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="favChromeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <g transform="translate(6, 6)" filter="url(#favDropShadow)">
    <!-- Outer Disc Rim -->
    <circle cx="40" cy="40" r="38" fill="url(#favBlueRim)" />
    <!-- Outer Rim Depth -->
    <circle cx="39.5" cy="40" r="35.5" fill="#011c40" opacity="0.6" />
    <!-- Blue Glow Disc Surface -->
    <circle cx="39" cy="39" r="34.5" fill="url(#favBlueDisc)" />
    <!-- Glossy Highlight -->
    <path d="M 12 36 A 34 34 0 0 1 66 22 A 34 31 0 0 0 16 38 Z" fill="#ffffff" opacity="0.25" />

    <!-- 3D Beveled C -->
    <path d="M 49 14 A 27 27 0 0 0 21 39 A 27 27 0 0 0 49 66 L 49 53 A 15 15 0 0 1 35 39 A 15 15 0 0 1 49 27 Z" fill="url(#favChromeBevel)" filter="url(#favCBevelShadow)" />
    <path d="M 48 15.5 A 25.5 25.5 0 0 0 22.5 39.5 A 25.5 25.5 0 0 0 48 64.5 L 48 53 A 14 14 0 0 1 36.5 39.5 A 14 14 0 0 1 48 26 Z" fill="url(#favChromeFace)" />
    <path d="M 33 21 A 25.5 25.5 0 0 1 48 16 L 48 18 A 23.5 23.5 0 0 0 35 23 Z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
