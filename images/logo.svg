<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 92" width="100%" height="100%" fill="none">
  <defs>
    <!-- Embedded Modern Typography & Adaptive Color Styling -->
    <style>
      .logo-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -0.25px;
        fill: #001f3f;
      }
      .logo-tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 12.5px;
        font-weight: 800;
        letter-spacing: 2.4px;
        fill: #ea580c;
        text-transform: uppercase;
      }
      @media (prefers-color-scheme: dark) {
        .logo-title {
          fill: #ffffff !important;
        }
        .logo-tagline {
          fill: #fbbf24 !important;
        }
      }
    </style>

    <!-- Drop Shadow Filter for 3D Emblem -->
    <filter id="ocDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#071630" flood-opacity="0.38"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>

    <filter id="cBevelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#021f4a" flood-opacity="0.5"/>
    </filter>

    <!-- Blue Disc Gradients -->
    <radialGradient id="blueDiscGrad" cx="38%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#034b9e"/>
      <stop offset="100%" stop-color="#022557"/>
    </radialGradient>

    <linearGradient id="blueRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#033878"/>
      <stop offset="100%" stop-color="#011938"/>
    </linearGradient>

    <!-- Metallic Chrome C Gradients -->
    <linearGradient id="chromeFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="chromeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="chromeInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Shining Swoosh Gradients -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="1"/>
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="swooshShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ==================== 3D EMBLEM (O & C) ==================== -->
  <g transform="translate(6, 4)" filter="url(#ocDropShadow)">
    <!-- Outer Beveled 3D Disc Base (O) -->
    <circle cx="40" cy="40" r="38" fill="url(#blueRimGrad)" />
    
    <!-- Outer Rim Inner Shadow/Bevel Depth -->
    <circle cx="39.5" cy="40" r="35.5" fill="#011c40" opacity="0.6" />
    
    <!-- Main Disc Spherical Surface with Rich Blue Radial Glow -->
    <circle cx="39" cy="39" r="34.5" fill="url(#blueDiscGrad)" />
    
    <!-- Glossy Specular Crescent on Top Rim of Blue Disc -->
    <path d="M 12 36 A 34 34 0 0 1 66 22 A 34 31 0 0 0 16 38 Z" fill="#ffffff" opacity="0.22" />

    <!-- 3D Beveled Chrome/White 'C' Interlocking Structure -->
    <!-- C Bevel Depth/Extrusion -->
    <path d="M 49 14 
             A 27 27 0 0 0 21 39
             A 27 27 0 0 0 49 66
             L 49 53
             A 15 15 0 0 1 35 39
             A 15 15 0 0 1 49 27
             Z" 
          fill="url(#chromeBevel)" 
          filter="url(#cBevelShadow)" />

    <!-- C Chrome Front Face (Glossy Metallic Silver-White) -->
    <path d="M 48 15.5 
             A 25.5 25.5 0 0 0 22.5 39.5
             A 25.5 25.5 0 0 0 48 64.5
             L 48 53
             A 14 14 0 0 1 36.5 39.5
             A 14 14 0 0 1 48 26
             Z" 
          fill="url(#chromeFace)" />

    <!-- C Inner Curve Chrome Highlight -->
    <path d="M 48 26
             A 14 14 0 0 0 36.5 39.5
             A 14 14 0 0 0 48 53
             L 48 51
             A 12 12 0 0 1 38.5 39.5
             A 12 12 0 0 1 48 28
             Z" 
          fill="url(#chromeInner)" opacity="0.8" />

    <!-- C Top Edge Specular Reflection -->
    <path d="M 33 21
             A 25.5 25.5 0 0 1 48 16
             L 48 18
             A 23.5 23.5 0 0 0 35 23
             Z" 
          fill="#ffffff" opacity="0.9" />
  </g>

  <!-- ==================== TYPOGRAPHY: ORIENTAL CONSULTANTS ==================== -->
  <g transform="translate(94, 0)">
    <!-- Crystal-Clear Executive Brand Title -->
    <text x="0" y="46.5" class="logo-title">Oriental Consultants</text>

    <!-- Shining Horizontal Swoosh Accent Line -->
    <path d="M 0 53.5 Q 135 48.5 270 53.5 Q 135 51 0 53.5 Z" fill="url(#swooshGrad)" />
    <path d="M 28 53.3 Q 135 49.5 242 53.3 Q 135 51 28 53.3 Z" fill="url(#swooshShine)" />

    <!-- High-Contrast Tagline: SIMPLIFYING SOLUTIONS -->
    <g transform="translate(28, 72)">
      <text x="0" y="0" class="logo-tagline">SIMPLIFYING SOLUTIONS</text>
    </g>
  </g>
</svg>
